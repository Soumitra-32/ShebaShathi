name: Daily service source check

on:
  schedule:
    - cron: "15 2 * * *" # every day at 02:15 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the public official-source check
        run: python scripts/refresh_services.py
        env:
          PYTHONPATH: backend
      - name: Commit the check result
        run: |
          if git diff --quiet -- data/services/refresh_status.json; then
            echo "No change in source-check status."
            exit 0
          fi
          git config user.name "ShebaShathi source check"
          git config user.email "actions@users.noreply.github.com"
          git add data/services/refresh_status.json
          git commit -m "chore: daily official-source check"
          git push
